server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # O IP do backend na rede privada do Railway MUDA a cada redeploy dele.
    # Com hostname literal, o nginx resolve uma vez no boot e nunca mais: o
    # /api ficava em 504 ate alguem reiniciar o frontend na mao. Passar o
    # destino por uma VARIAVEL e o que forca nova resolucao a cada requisicao
    # — a diretiva `resolver` sozinha nao muda nada, ela so passa a ser usada
    # porque ha variavel. Ver docs/adr/0010-nginx-re-resolve-o-backend.md.
    #
    # fd12::10 e o DNS interno do Railway, igual em qualquer projeto. NAO e o
    # 127.0.0.11 do Docker, que nao existe la.
    resolver [fd12::10] ipv6=on valid=1s;
    set $backend ${BACKEND_URL};

    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        client_max_body_size 20m;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    # Webhook da Meta (WhatsApp Cloud API) — repassado ao backend pela rede
    # privada, para que o backend não precise de domínio público próprio.
    # A validação HMAC (X-Hub-Signature-256) depende do corpo cru: nginx
    # repassa o body sem alterar, então a assinatura continua válida.
    location /webhook {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # O service worker NÃO pode ser cacheado: ele casa com a regra de .js abaixo
    # (expires 1y, immutable), e era o próprio arquivo que conserta o cache que
    # ficava preso nele. `location =` tem precedência sobre regex no nginx.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # .mjs servido com MIME correto via add_header (sem bloco types aninhado)
    location ~* \.mjs$ {
        include /etc/nginx/security-headers.conf;
        add_header Content-Type "application/javascript" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}