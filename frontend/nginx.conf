server {
    # Porta em que o Nginx vai escutar — definida via variável de ambiente (ex: 8080)
    listen ${PORT};

    # Diretório raiz onde os arquivos estáticos do frontend estão (HTML, JS, CSS)
    root /usr/share/nginx/html;

    # Arquivo padrão servido quando acessa a raiz (ex: / → index.html)
    index index.html;

    # ─── HEADERS DE SEGURANÇA ───────────────────────────────────────

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORRIGIDO: camera=(self) permite acesso à câmera na própria origem
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # CORRIGIDO:
    # - worker-src 'self' blob:         → permite Web Workers do pdfjs-dist e tesseract.js
    # - 'unsafe-eval'                   → necessário para WebAssembly (tesseract.js compila WASM em runtime)
    # - cdn.jsdelivr.net em script-src  → worker JS do Tesseract vem desse CDN
    # - connect-src cdn.jsdelivr.net    → download do worker e dados de idioma (por.traineddata)
    # - tessdata.projectnaptha.com      → servidor dos dados de OCR em português
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; frame-ancestors 'none';" always;

    # ─── SPA (Single Page Application) ───────────────────────────────

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── PROXY REVERSO PARA API ─────────────────────────────────────

    location /api {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        client_max_body_size 20m;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    # ─── MIME TYPE EXPLÍCITO PARA .mjs ──────────────────────────────

    # CORRIGIDO: bloco separado para .mjs com types explícito
    # Sem isso o nginx serve .mjs como application/octet-stream, quebrando o worker do pdfjs-dist
    # O erro era: "The server responded with a non-JavaScript MIME type of application/octet-stream"
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── CACHE DE ARQUIVOS ESTÁTICOS ────────────────────────────────

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── COMPRESSÃO GZIP ────────────────────────────────────────────

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}