server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redireciona as chamadas de API para o seu backend real
   location /api {
       proxy_pass ${BACKEND_URL};
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection 'upgrade';
       proxy_set_header Host $host;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_cache_bypass $http_upgrade;

       # Timeouts (já adicionados antes)
       proxy_connect_timeout 10s;
       proxy_send_timeout 60s;
       proxy_read_timeout 60s;
       proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
       proxy_next_upstream_tries 2;

       # NOVO: aumenta o buffer de headers para evitar 502 "too big header"
       proxy_buffer_size 16k;
       proxy_buffers 4 16k;
       proxy_busy_buffers_size 32k;
   }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}