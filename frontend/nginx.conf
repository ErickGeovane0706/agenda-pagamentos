server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # ─── MIME TYPES ─────────────────────────────────────────────────
    types {
        include /etc/nginx/mime.types;
        application/javascript mjs;
    }

    # ─── HEADERS DE SEGURANÇA ───────────────────────────────────────

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # camera=(self) permite acesso à câmera na própria origem
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Correções acumuladas:
    # - worker-src blob:                → workers do pdfjs-dist e tesseract.js (blob URL)
    # - 'unsafe-eval'                   → WebAssembly do tesseract.js (compila WASM em runtime)
    # - 'wasm-unsafe-eval'              → alternativa mais restrita ao unsafe-eval (browsers modernos)
    # - connect-src blob:               → tesseract.js v7 usa fetch() em blob URLs internamente
    # - connect-src cdn.jsdelivr.net    → worker JS e dados de OCR do tesseract via jsDelivr
    # - connect-src tessdata.projectnaptha.com → fallback de langPath do tesseract
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; frame-ancestors 'none';" always;

    # ─── SPA ─────────────────────────────────────────────────────────

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── PROXY REVERSO PARA API ─────────────────────────────────────

    location /api {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        client_max_body_size 20m;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    # ─── CACHE DE ARQUIVOS ESTÁTICOS ────────────────────────────────

    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── COMPRESSÃO GZIP ────────────────────────────────────────────

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}