server {
    # Porta em que o Nginx vai escutar — definida via variável de ambiente (ex: 8080)
    listen ${PORT};

    # Diretório raiz onde os arquivos estáticos do frontend estão (HTML, JS, CSS)
    root /usr/share/nginx/html;

    # Arquivo padrão servido quando acessa a raiz (ex: / → index.html)
    index index.html;

    # ─── HEADERS DE SEGURANÇA ───────────────────────────────────────

    # Impede que o site seja embutido em iframes de outros domínios (proteção contra clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Impede que o navegador faça MIME-sniffing (força o Content-Type declarado pelo servidor)
    add_header X-Content-Type-Options "nosniff" always;

    # Força conexão HTTPS por 1 ano, incluindo subdomínios (HSTS — HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Controla quanto da URL de referência é enviada ao navegar entre origens
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORRIGIDO: camera=(self) permite acesso à câmera na própria origem
    # Anteriormente camera=() bloqueava completamente, impedindo o leitor de código de barras
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # CSP (Content Security Policy) — restringe quais recursos podem ser carregados
    # CORRIGIDO: adicionado worker-src 'self' blob: para permitir Web Workers do pdfjs-dist e tesseract.js
    # Sem isso, os workers eram bloqueados com erro "violates Content Security Policy directive: script-src"
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; frame-ancestors 'none';" always;

    # ─── SPA (Single Page Application) ───────────────────────────────

    location / {
        # Tenta servir o arquivo exato. Se não existir, tenta o diretório.
        # Se nada funcionar, serve /index.html (essencial para rotas do React/Vue/Angular)
        try_files $uri $uri/ /index.html;
    }

    # ─── PROXY REVERSO PARA API ─────────────────────────────────────

    location /api {
        # Redireciona requisições /api/* para o backend (definido via variável de ambiente)
        proxy_pass ${BACKEND_URL};

        # Usa HTTP/1.1 para o backend (necessário para connection upgrade - WebSocket)
        proxy_http_version 1.1;

        # Repassa headers de upgrade para suportar WebSockets (ex: SignalR, Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Repassa o host original da requisição (importante para apps que usam Host header)
        proxy_set_header Host $host;

        # Adiciona o IP real do cliente à lista de forwarded-for (logs / auditoria)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Informa ao backend se a conexão original era HTTP ou HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;

        # Não usa cache do Nginx quando há upgrade (WebSocket)
        proxy_cache_bypass $http_upgrade;

        # ─── TIMEOUTS ────────────────────────────────────────────────

        # Tempo máximo para estabelecer conexão com o backend
        proxy_connect_timeout 10s;

        # Tempo máximo para enviar dados ao backend
        proxy_send_timeout 60s;

        # Tempo máximo para receber resposta do backend
        proxy_read_timeout 60s;

        # Se o backend falhar (timeout, erro, 502 etc), tenta o próximo servidor do upstream
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

        # Número máximo de tentativas de encaminhar para upstreams alternativos
        proxy_next_upstream_tries 2;

        # Tamanho máximo permitido para o corpo da requisição (upload de arquivos)
        client_max_body_size 20m;

        # ─── BUFFERS ────────────────────────────────────────────────

        # Tamanho do buffer para ler a primeira parte da resposta (cabeçalhos)
        proxy_buffer_size 16k;

        # Número e tamanho dos buffers para ler a resposta completa do backend
        proxy_buffers 4 16k;

        # Tamanho máximo dos buffers ocupados antes de enviar ao cliente
        proxy_busy_buffers_size 32k;
    }

    # ─── CACHE DE ARQUIVOS ESTÁTICOS ────────────────────────────────

    # CORRIGIDO: adicionado mjs à lista para servir os workers do pdfjs-dist
    # com Content-Type correto (application/javascript), evitando erro de MIME type
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        # Define cache do navegador por 1 ano (arquivos com hash no nome são imutáveis)
        expires 1y;

        # Indica que o recurso é público (pode ser cacheado por proxies/CDNs) e imutável
        add_header Cache-Control "public, immutable";
    }

    # ─── COMPRESSÃO GZIP ────────────────────────────────────────────

    # Habilita compressão gzip nas respostas
    gzip on;

    # Tipos MIME que serão comprimidos (texto, CSS, JSON, JS)
    gzip_types text/plain text/css application/json application/javascript;
}