# Headers de seguranca centralizados.
# Incluido no bloco `server` E em cada `location` que tem add_header proprio:
# no nginx, um bloco filho com qualquer add_header descarta TODOS os
# add_header herdados do pai — sem este include os assets sairiam sem CSP.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

# challenges.cloudflare.com: o Cloudflare Turnstile (anti-bot do cadastro) carrega
# um script de la E renderiza um iframe de la. Precisa estar em script-src (o
# script), frame-src (o iframe do desafio) e connect-src (o siteverify que o
# widget chama). Sem frame-src explicito o iframe cairia em default-src 'self' e
# seria bloqueado em silencio — o widget nao aparece e parece problema de dominio.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://challenges.cloudflare.com; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob: https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none';" always;
