# Headers de seguranca centralizados.
# Incluido no bloco `server` E em cada `location` que tem add_header proprio:
# no nginx, um bloco filho com qualquer add_header descarta TODOS os
# add_header herdados do pai — sem este include os assets sairiam sem CSP.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

# challenges.cloudflare.com: o Cloudflare Turnstile (anti-bot do cadastro) carrega
# um script de la E renderiza um iframe de la. Precisa estar em script-src (o
# script), frame-src (o iframe do desafio) e connect-src (o siteverify que o
# widget chama). Sem frame-src explicito o iframe cairia em default-src 'self' e
# seria bloqueado em silencio — o widget nao aparece e parece problema de dominio.
# *.ingest.de.sentry.io: para onde o SDK de monitoramento manda os erros. So
# connect-src — nao carregamos script deles.
#
# O ".de." NAO e detalhe: o host de ingestao carrega a regiao da ORGANIZACAO,
# escolhida na criacao da conta e fixa depois. Esta conta e europeia, entao
# `*.ingest.sentry.io` e `*.ingest.us.sentry.io` NAO casam — em CSP o curinga
# compara o sufixo inteiro, e `o123.ingest.de.sentry.io` nao termina em
# `.ingest.sentry.io`. Se algum dia a organizacao mudar de regiao, este host
# muda junto.
#
# Sem isto o navegador bloqueia o envio EM SILENCIO e o painel fica vazio
# parecendo que nao ha erro nenhum — o pior desfecho possivel para uma
# ferramenta cuja unica funcao e avisar.
#
# Pixel da Meta (medicao do trafego pago): sao DOIS hosts diferentes e faltar
# qualquer um quebra a medicao sem aviso. connect.facebook.net serve o
# fbevents.js (script-src). www.facebook.com e para onde os eventos vao — o SDK
# manda ora como imagem 1x1 em /tr, ora por fetch, dependendo do navegador, e
# por isso precisa estar em img-src E em connect-src. So um dos dois faz o
# evento sumir em parte dos aparelhos, que e o defeito mais dificil de
# diagnosticar: o painel mostra conversao, so que menos do que a real.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://challenges.cloudflare.com https://connect.facebook.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://www.facebook.com; connect-src 'self' blob: https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://challenges.cloudflare.com https://*.ingest.de.sentry.io https://www.facebook.com https://connect.facebook.net; frame-src https://challenges.cloudflare.com; frame-ancestors 'none';" always;
