# Headers de seguranca centralizados.
# Incluido no bloco `server` E em cada `location` que tem add_header proprio:
# no nginx, um bloco filho com qualquer add_header descarta TODOS os
# add_header herdados do pai — sem este include os assets sairiam sem CSP.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob: https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; frame-ancestors 'none';" always;
