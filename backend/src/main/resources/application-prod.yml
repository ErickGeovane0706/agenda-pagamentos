spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

logging:
  level:
    root: WARN
    com.agenda: INFO

# Produção SEMPRE fala com o Asaas de produção. O default de sandbox vive no
# application.yml (para o dev local, que roda sem o perfil prod); aqui ele é
# sobrescrito para produção. Assim não depende da variável ASAAS_BASE_URL chegar
# ao container — que foi exatamente o que falhou no Railway. A variável ainda
# funciona como override, se um dia for preciso apontar prod para outro lugar.
asaas:
  base-url: ${ASAAS_BASE_URL:https://api.asaas.com/v3}

# URL pública do app em produção. Default aqui (em vez de depender só da env var)
# pelo mesmo motivo do asaas.base-url: se APP_FRONTEND_URL não chegar ao
# container, o link de retorno do pagamento e os links de email sairiam apontando
# para localhost. A env var continua como override.
app:
  frontend-url: ${APP_FRONTEND_URL:https://app-agendapagamentos.up.railway.app}