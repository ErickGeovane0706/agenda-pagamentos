spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  token: ${WHATSAPP_TOKEN}
  webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}

# Modelo de cobrança: produto único, preço por loja (base inclui 1 loja).
# preco-base e preco-loja-adicional ainda não são lidos pelo código — são a
# fonte única do valor cobrado no Payment Link manual (Fase 1) e serão usados
# pela integração com o gateway (Fase 2). Ver PLANO-MONETIZACAO.md.
assinatura:
  preco-base: ${ASSINATURA_PRECO_BASE:79.00}
  preco-loja-adicional: ${ASSINATURA_PRECO_LOJA_ADICIONAL:29.00}
  carencia-dias: ${ASSINATURA_CARENCIA_DIAS:5}
  trial-dias: ${ASSINATURA_TRIAL_DIAS:30}

# Gateway de pagamento (Asaas). O webhook-token autentica o POST /webhook/asaas
# (header asaas-access-token, definido ao cadastrar o webhook no painel).
# base-url aponta para o SANDBOX por padrão — trocar para https://api.asaas.com/v3
# em produção. api-key é a chave da API (sandbox primeiro); sem ela a criação de
# customer/subscription via API não funciona (Fase 2 item 4 do PLANO-MONETIZACAO.md).
asaas:
  base-url: ${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
  api-key: ${ASAAS_API_KEY:}
  webhook-token: ${ASAAS_WEBHOOK_TOKEN:}

# Envio de email transacional (Resend) — reset de senha (e, adiante, confirmação
# de cadastro). Sem RESEND_API_KEY o EmailService apenas loga o email (dev local:
# o link aparece no log). Em produção, "from" precisa ser remetente de um domínio
# verificado no Resend.
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Agenda de Pagamentos <onboarding@resend.dev>}

# URL pública do frontend, usada para montar links enviados por email.
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

senha-reset:
  ttl-horas: ${SENHA_RESET_TTL_HORAS:2}

# Transcrição de mensagens de voz do WhatsApp. Fornecedor separado da Anthropic
# porque os modelos Claude não aceitam áudio como entrada — ver TranscricaoAudioService.
openai:
  api-key: ${OPENAI_API_KEY:}
  transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:whisper-1}