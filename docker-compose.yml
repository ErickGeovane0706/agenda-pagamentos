version: '3.8'

services:
  db:
    # Acompanha a produção, que é a imagem Debian do 18.
    # NÃO trocar por -alpine: o musl ignora o locale e ordena texto byte a
    # byte (maiúsculas antes de minúsculas), enquanto a glibc ordena em
    # ordem de dicionário como a produção. Os dois reportam o mesmo
    # datcollate, então a diferença só aparece no resultado do ORDER BY.
    # Trocar a major exige recriar o volume.
    image: postgres:18
    environment:
      POSTGRES_DB: agenda_pagamentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # 18+ exige o mount aqui, e NÃO em /var/lib/postgresql/data: a imagem
      # guarda os dados num subdiretório por major (18/docker). Apontar para
      # .../data faz o container morrer no boot com "unused mount/volume".
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://db:5432/agenda_pagamentos
      DATABASE_USER: postgres
      DATABASE_PASS: postgres
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: agenda-pagamentos-arquivos
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      PORT: 8080
    # Passa o .env inteiro ao container SEM interpolar (a chave Asaas começa com
    # '$', que a substituição do compose quebraria). O bloco environment acima
    # tem precedência sobre estas (mantém DB/porta fixos no docker).
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
